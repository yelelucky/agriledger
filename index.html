<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d5a26"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="AgriLedger"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/favicon-64.png"><link rel="apple-touch-icon" href="icons/apple-touch-icon.png"></head><body>
<title>AgriLedger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Mukta:wght@400;500;600;700&display=swap">
<script async src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: leaf-green side panel like a field strip, cream ledger cards (like a bahi-khata) on a sky-to-field backdrop.
   Token names are kept from earlier versions: --violet = leaf green (main), --mint = paddy gold (second), --glass = card. */
:root{
  --bg-a:#e8f1dc; --bg-b:#f6f2e2; --bg-c:#dde8c6;
  --ink:#1d2917; --ink-2:#44523a; --ink-3:#69745b;
  --glass:#fffdf5; --glass-2:#f7f2e1; --glass-3:#ffffff;
  --rim:rgba(96,78,30,.18); --rim-2:rgba(96,78,30,.11); --line:rgba(70,56,20,.12);
  --shadow:0 6px 18px -10px rgba(70,56,20,.38);
  --violet:#2e7d32; --violet-2:#43a047; --violet-soft:rgba(46,125,50,.12); --on-violet:#ffffff;
  --mint:#f0b429; --mint-2:#ffd666; --on-mint:#3a2900;
  --amber:#e8891c; --soil:#8d5a2b; --soil-soft:rgba(141,90,43,.13); --sky:#d7ebf5; --sky-ink:#1f5f7a;
  --good:#2e7d32; --good-bg:rgba(46,125,50,.13);
  --warn:#9a5800; --warn-bg:rgba(240,180,41,.22);
  --bad:#b3261e; --bad-bg:rgba(179,38,30,.11);
  --solid:#fbf8ee;
  --side-a:#1d5a26; --side-b:#2e7d32; --side-ink:#f3f8ec; --side-ink-2:rgba(243,248,236,.74);
  --iri:linear-gradient(135deg,#f0b429,#e8a317 55%,#7cb342);
  --f-display:'Baloo 2', 'Segoe UI', system-ui, sans-serif;
  --f-body:'Mukta', 'Segoe UI', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg-a:#101810; --bg-b:#131b11; --bg-c:#18240f;
  --ink:#eef3e4; --ink-2:#c8d3ba; --ink-3:#9ba78c;
  --glass:#1b2518; --glass-2:#223020; --glass-3:#283726;
  --rim:rgba(220,232,190,.15); --rim-2:rgba(220,232,190,.08); --line:rgba(220,232,190,.10);
  --shadow:0 8px 20px -12px rgba(0,0,0,.7);
  --violet:#7cc47f; --violet-2:#9bd69d; --violet-soft:rgba(124,196,127,.16); --on-violet:#0b1a0b;
  --mint:#f0b429; --mint-2:#ffcf52; --on-mint:#2a1d00;
  --amber:#f2a03a; --soil:#c99062; --soil-soft:rgba(201,144,98,.16); --sky:#1d3340; --sky-ink:#9fd2ea;
  --good:#7cc47f; --good-bg:rgba(124,196,127,.15);
  --warn:#f2c14e; --warn-bg:rgba(242,193,78,.15);
  --bad:#ff8a80; --bad-bg:rgba(255,138,128,.14);
  --solid:#182116; --side-a:#0f2a12; --side-b:#173d1b; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg-a:#101810; --bg-b:#131b11; --bg-c:#18240f;
  --ink:#eef3e4; --ink-2:#c8d3ba; --ink-3:#9ba78c;
  --glass:#1b2518; --glass-2:#223020; --glass-3:#283726;
  --rim:rgba(220,232,190,.15); --rim-2:rgba(220,232,190,.08); --line:rgba(220,232,190,.10);
  --shadow:0 8px 20px -12px rgba(0,0,0,.7);
  --violet:#7cc47f; --violet-2:#9bd69d; --violet-soft:rgba(124,196,127,.16); --on-violet:#0b1a0b;
  --mint:#f0b429; --mint-2:#ffcf52; --on-mint:#2a1d00;
  --amber:#f2a03a; --soil:#c99062; --soil-soft:rgba(201,144,98,.16); --sky:#1d3340; --sky-ink:#9fd2ea;
  --good:#7cc47f; --good-bg:rgba(124,196,127,.15);
  --warn:#f2c14e; --warn-bg:rgba(242,193,78,.15);
  --bad:#ff8a80; --bad-bg:rgba(255,138,128,.14);
  --solid:#182116; --side-a:#0f2a12; --side-b:#173d1b; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{min-height:100%}
body{
  margin:0; font-family:var(--f-body); font-size:16px; line-height:1.5; color:var(--ink);
  background-color:var(--bg-b);
  background-image:linear-gradient(180deg, var(--bg-a) 0, var(--bg-b) 280px, var(--bg-b) 75%, var(--bg-c) 100%);
}
/* a strip of ploughed-field rows along the bottom of the screen (no blur, cheap to draw; hidden on phones) */
.bg-light{position:fixed; left:0; right:0; bottom:0; height:120px; pointer-events:none; z-index:-1; opacity:.55;
  background:repeating-linear-gradient(100deg, transparent 0 22px, rgba(46,125,50,.10) 22px 26px);
  -webkit-mask-image:linear-gradient(transparent, #000); mask-image:linear-gradient(transparent, #000)}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; margin:0; letter-spacing:0; line-height:1.2}
h1{font-size:29px; font-weight:800}
h2{font-size:20px; font-weight:700}
h3{font-size:17px; font-weight:700}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2.5px solid var(--mint); outline-offset:2px}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- cards (solid: no blur, so phones scroll smoothly) ---------- */
.glass{background:var(--glass); border:1px solid var(--rim); border-radius:20px; box-shadow:var(--shadow)}
.iri{border:2px solid var(--mint) !important; background:var(--glass) !important}

/* ---------- shell ---------- */
.shell{position:relative; min-height:100vh}
.side{position:fixed; z-index:5; top:14px; bottom:14px; left:max(14px, env(safe-area-inset-left,0px)); width:252px;
  display:flex; flex-direction:column; gap:14px; padding:18px 14px; border-radius:24px; overflow:auto}
.side.glass{background:linear-gradient(170deg, var(--side-a), var(--side-b)); border-color:transparent; color:var(--side-ink)}
.brand{display:flex; align-items:center; gap:12px; padding:4px 6px 12px; border-bottom:1px solid rgba(255,255,255,.14)}
.brand-mark{width:46px; height:46px; border-radius:50%; flex:none; display:grid; place-items:center; background:var(--mint); box-shadow:0 0 0 3px rgba(255,255,255,.18)}
.brand-mark svg{width:26px; height:26px; color:#1d5a26}
.brand b{display:block; font-family:var(--f-display); font-size:20px; font-weight:800; line-height:1.1; color:var(--side-ink)}
.brand small{display:block; color:var(--side-ink-2); font-size:13.5px; line-height:1.3}
.nav{display:flex; flex-direction:column; gap:2px}
.nav button{display:flex; align-items:center; gap:12px; width:100%; text-align:left; border:0; background:none;
  padding:9px 12px; border-radius:14px; cursor:pointer; color:var(--side-ink-2); font-weight:600; font-size:15.5px}
.nav button:hover{background:rgba(255,255,255,.10); color:var(--side-ink)}
.nav button.on{color:#2a1d00; background:var(--mint); box-shadow:0 6px 14px -8px rgba(0,0,0,.45)}
.nav svg{width:21px; height:21px; flex:none}
.nav .ph{margin-left:auto; font-size:11px; font-weight:700; letter-spacing:.04em}
.side-foot{margin-top:auto; display:flex; flex-direction:column; gap:10px; padding-top:10px; border-top:1px solid rgba(255,255,255,.14)}
.side .save-state{color:var(--side-ink-2)}
.side .seg{background:rgba(255,255,255,.12); border-color:transparent}
.side .seg button{color:var(--side-ink-2)} .side .seg button.on{background:var(--side-ink); color:#1d5a26}
.side .icon-btn{background:rgba(255,255,255,.12); border-color:transparent; color:var(--side-ink)}
.side .btn.ghost{color:var(--side-ink)}
.save-state{display:flex; align-items:center; gap:8px; font-size:13.5px; color:var(--ink-2); line-height:1.3}
.dot{width:10px; height:10px; border-radius:50%; flex:none; background:var(--good)}
.dot.saving{background:var(--amber)} .dot.error{background:var(--bad)} .dot.local{background:var(--warn)}
.side .dot, .topbar .dot{background:#9be27a} .side .dot.saving, .topbar .dot.saving{background:var(--mint)}
.side .dot.error, .topbar .dot.error{background:#ff8a80} .side .dot.local, .topbar .dot.local{background:#9be27a}
.main{margin-left:280px; padding-block:26px 48px; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(28px, env(safe-area-inset-right,0px)); min-width:0}
.page{display:flex; flex-direction:column; gap:18px; max-width:1480px}
.page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap}
.page-head .sub{color:var(--ink-2); margin-top:2px}
.row{display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.row.end{justify-content:flex-end}
.row.between{justify-content:space-between}
.stack{display:flex; flex-direction:column; gap:14px}
.card{padding:20px 22px}
.card-head{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:14px; flex-wrap:wrap}
.muted{color:var(--ink-3)}
.small{font-size:14px}
.grid-2{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px}
.grid-3{display:grid; grid-template-columns:2fr 1fr; gap:18px}
/* farm-coloured icon badges: leaf green, paddy gold, soil brown, sky blue */
.ic-b{display:inline-grid; place-items:center; border-radius:14px; flex:none}
.c-green{background:var(--violet-soft); color:var(--violet)} .c-gold{background:var(--warn-bg); color:#9a6400}
.c-soil{background:var(--soil-soft); color:var(--soil)} .c-sky{background:var(--sky); color:var(--sky-ink)}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; height:42px; padding:0 20px; border-radius:999px;
  border:1px solid var(--rim); background:var(--glass-2); color:var(--ink); font-weight:650; font-size:15px; cursor:pointer; white-space:nowrap;
  box-shadow:0 2px 0 var(--rim-2); font-family:var(--f-body)}
.btn:active{transform:translateY(1px)}
@media (hover:hover){ .btn:hover{filter:brightness(1.04)} }
.btn:disabled,.btn[aria-disabled="true"]{opacity:.5; cursor:not-allowed; transform:none; filter:none}
.btn.primary{background:var(--violet); color:var(--on-violet); border-color:transparent; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.btn.mint{background:var(--mint); color:var(--on-mint); border-color:transparent; box-shadow:0 3px 0 rgba(120,80,0,.25)}
.btn.danger{background:var(--bad-bg); color:var(--bad); border-color:transparent; box-shadow:none}
.btn.ghost{background:transparent; box-shadow:none}
.btn.sm{height:34px; padding:0 14px; font-size:14px}
.icon-btn{width:36px; height:36px; border-radius:50%; border:1px solid var(--rim); background:var(--glass-2); cursor:pointer; display:inline-grid; place-items:center; color:var(--ink-2); flex:none}
.icon-btn:hover{color:var(--ink)}
.icon-btn:disabled{opacity:.35; cursor:not-allowed}
.icon-btn svg{width:16px; height:16px}

/* ---------- forms ---------- */
.form-grid{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:14px 16px}
.form-grid .span-2{grid-column:span 2} .form-grid .span-3{grid-column:1/-1}
.field{display:flex; flex-direction:column; gap:6px; min-width:0}
.lbl{font-size:13.5px; font-weight:650; color:var(--ink-2)}
.req{color:var(--bad); font-weight:700}
.hint{font-size:13px; color:var(--ink-3); line-height:1.35}
.in{width:100%; height:44px; padding:0 14px; border-radius:14px; border:1px solid var(--rim); background:var(--glass-3); color:var(--ink);
  box-shadow:inset 0 1px 2px rgba(30,34,60,.08)}
textarea.in{height:auto; padding:10px 14px; resize:vertical; min-height:74px}
select.in{cursor:pointer}
.in:focus{outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-soft)}
.in.bad{border-color:var(--bad); box-shadow:0 0 0 3px var(--bad-bg)}
.search{position:relative; flex:1 1 320px; max-width:520px}
.search .in{height:48px; border-radius:999px; padding-left:20px; padding-right:58px; font-size:15.5px}
.search .go{position:absolute; right:5px; top:5px; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:var(--violet); color:var(--on-violet); pointer-events:none}
.search .go svg{width:17px; height:17px}
.form-err{border-radius:14px; padding:10px 14px; background:var(--bad-bg); color:var(--bad); font-size:14.5px}
.form-err ul{margin:4px 0 0; padding-left:20px}
.notice{border-radius:16px; padding:12px 16px; background:var(--warn-bg); color:var(--ink); font-size:14.5px; border:1px solid var(--rim-2)}
.notice b{color:var(--warn)}
.check{display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:15px}
.check input{width:18px; height:18px; margin-top:2px; accent-color:var(--violet); flex:none}

/* toggle switch: leaf-green track, paddy-gold knob */
.switch{position:relative; display:inline-flex; align-items:center; gap:12px; cursor:pointer; font-size:15px}
.switch input{position:absolute; opacity:0; width:1px; height:1px}
.switch .track{width:58px; height:32px; border-radius:999px; background:var(--glass-3); border:1px solid var(--rim); position:relative; flex:none;
  box-shadow:inset 0 1px 3px rgba(30,34,60,.15); transition:background .18s}
.switch .track::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:50%; background:#fff;
  box-shadow:0 3px 8px rgba(30,34,60,.25); transition:transform .18s, background .18s}
.switch input:checked + .track{background:linear-gradient(90deg,var(--violet),var(--violet-2))}
.switch input:checked + .track::after{transform:translateX(26px); background:var(--mint)}
.switch input:focus-visible + .track{outline:2.5px solid var(--violet); outline-offset:2px}

.seg{display:inline-flex; padding:3px; border-radius:999px; background:var(--glass-2); border:1px solid var(--rim); gap:2px}
.seg button{border:0; background:none; border-radius:999px; padding:5px 11px; font-size:13px; font-weight:650; color:var(--ink-2); cursor:pointer}
.seg button.on{background:var(--glass-3); color:var(--ink); box-shadow:0 2px 8px -2px rgba(30,34,60,.25)}

/* ---------- chips, tiles, tables ---------- */
.chip{display:inline-flex; align-items:center; gap:6px; height:26px; padding:0 11px; border-radius:999px; font-size:13px; font-weight:650; white-space:nowrap;
  background:var(--glass-2); border:1px solid var(--rim-2); color:var(--ink-2)}
.chip.good{background:var(--good-bg); color:var(--good); border-color:transparent}
.chip.warn{background:var(--warn-bg); color:var(--warn); border-color:transparent}
.chip.bad{background:var(--bad-bg); color:var(--bad); border-color:transparent}
.chip.violet{background:var(--violet-soft); color:var(--violet); border-color:transparent}
.chip.mono{font-variant-numeric:tabular-nums; letter-spacing:.02em}
.tiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:12px}
.tile{padding:14px 16px; border-radius:18px; background:var(--glass-2); border:1px solid var(--rim-2); display:flex; flex-direction:column; gap:4px; min-width:0}
.tile .t-lbl{font-size:13px; color:var(--ink-3); font-weight:600; line-height:1.3}
.tile .t-val{font-family:var(--f-display); font-size:22px; font-weight:700; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.tile .t-note{font-size:12.5px; color:var(--ink-3)}
.group-lbl{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-3); margin:4px 0 8px}
.table-wrap{overflow-x:auto; border-radius:16px; border:1px solid var(--rim-2); background:var(--glass-3)}
table.data{width:100%; border-collapse:collapse; font-size:15px}
table.data th{text-align:left; font-size:12.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-3); font-weight:700;
  padding:11px 14px; border-bottom:1px solid var(--line); white-space:nowrap; background:var(--glass-2)}
table.data td{padding:11px 14px; border-bottom:1px solid var(--line); vertical-align:top}
table.data tr:last-child td{border-bottom:0}
table.data tbody tr.click{cursor:pointer}
table.data tbody tr.click:hover td{background:var(--violet-soft)}
td.num,th.num{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td.nowrap{white-space:nowrap}
.empty{display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:36px 20px; color:var(--ink-2)}
.empty .e-mark{width:66px; height:66px; border-radius:22px; display:grid; place-items:center; font-size:28px; background:var(--violet-soft); color:var(--violet)}
.empty .e-mark svg{width:34px; height:34px}
.empty h3{color:var(--ink)}
.empty p{max-width:52ch}

/* ---------- dashboard ---------- */
.alerts{display:flex; flex-direction:column; gap:8px}
.alert{display:flex; align-items:center; gap:12px; padding:11px 16px; border-radius:16px; font-size:15px; border:1px solid var(--rim-2); background:var(--glass-2)}
.alert .a-ic{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex:none; font-size:15px}
.alert.warn .a-ic{background:var(--warn-bg)} .alert.bad .a-ic{background:var(--bad-bg)} .alert.ok .a-ic{background:var(--good-bg)}
.alert .a-txt{flex:1; min-width:0}
.quick{display:grid; grid-template-columns:repeat(auto-fill,minmax(112px,1fr)); gap:10px}
.qa{display:flex; flex-direction:column; align-items:flex-start; gap:8px; padding:14px; border-radius:18px; cursor:pointer; text-align:left;
  border:1px solid var(--rim); background:var(--glass-2); box-shadow:0 3px 0 var(--rim-2)}
.qa:active{transform:translateY(2px)}
.qa .q-ic{width:46px; height:46px; display:grid; place-items:center; border-radius:14px}
.qa .q-ic svg{width:28px; height:28px}
.qa b{font-size:15px; line-height:1.2}
.qa small{font-size:12px; color:var(--ink-3); font-weight:600}
.qa:disabled{cursor:not-allowed; opacity:.62; transform:none}
.backup-card{display:flex; flex-direction:column; gap:12px}
.big-date{font-family:var(--f-display); font-size:24px; font-weight:800}

/* ---------- tabs ---------- */
.tabs{display:flex; gap:6px; flex-wrap:wrap; padding:5px; border-radius:999px; background:var(--glass); border:1px solid var(--rim); width:fit-content; max-width:100%}
.tabs button{border:1.5px solid transparent; background:none; border-radius:999px; padding:7px 15px; font-weight:650; font-size:14.5px; color:var(--ink-2); cursor:pointer}
.tabs button.on{background:var(--violet); color:var(--on-violet)}
.list-layout{display:grid; grid-template-columns:260px minmax(0,1fr); gap:18px}
.list-pick{display:flex; flex-direction:column; gap:4px}
.list-pick button{display:flex; justify-content:space-between; gap:8px; text-align:left; border:1px solid transparent; background:none; padding:9px 12px; border-radius:12px; cursor:pointer; font-weight:600; color:var(--ink-2)}
.list-pick button.on{background:var(--violet-soft); border-color:var(--violet); color:var(--ink)}
.list-pick .n{color:var(--ink-3); font-variant-numeric:tabular-nums}
.li-row{display:flex; align-items:center; gap:10px; padding:8px 10px; border-radius:14px; background:var(--glass-3); border:1px solid var(--rim-2)}
.li-row .nm{flex:1; min-width:0; font-weight:600; overflow-wrap:anywhere}
.li-row select.in{height:36px; width:auto; max-width:260px; font-size:14px}
.kv{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px 20px}
.kv div{min-width:0}
.kv dt{font-size:13px; color:var(--ink-3); font-weight:600}
.kv dd{margin:2px 0 0; font-weight:600; overflow-wrap:anywhere}
.season-row{display:grid; grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) minmax(0,1fr) 40px; gap:10px; align-items:end}
.check-list{display:flex; flex-direction:column; gap:8px}
.ck{display:grid; grid-template-columns:30px minmax(0,1fr) auto; gap:12px; align-items:start; padding:12px 14px; border-radius:16px; background:var(--glass-3); border:1px solid var(--rim-2)}
.ck .mark{width:28px; height:28px; border-radius:50%; display:grid; place-items:center; font-weight:800; font-size:14px}
.ck .mark.pass{background:var(--good-bg); color:var(--good)} .ck .mark.fail{background:var(--bad-bg); color:var(--bad)} .ck .mark.wait{background:var(--glass-2); color:var(--ink-3)}
.ck code{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace; font-size:13px; color:var(--ink-2)}

/* ---------- entry forms, ledgers ---------- */
.pform{display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:18px; align-items:start}
.calc{position:sticky; top:70px; padding:16px; border-radius:18px; background:var(--glass-3); border:1px solid var(--rim); display:flex; flex-direction:column; gap:6px; min-width:0}
.calc h3{margin-bottom:4px}
.calc .ln{display:flex; justify-content:space-between; gap:10px; font-variant-numeric:tabular-nums}
.calc .ln span:first-child{color:var(--ink-2)}
.calc .ln span:last-child{font-weight:650; text-align:right}
.calc .tot{font-family:var(--f-display); font-size:19px; border-top:1px solid var(--line); padding-top:8px; margin-top:4px}
.calc .tot span:first-child{color:var(--ink)}
.calc .f{font-size:12.5px; color:var(--ink-3); margin-top:-3px}
.calc .neg{color:var(--bad)} .calc .pos{color:var(--good)}
fieldset.fs{border:1px solid var(--rim-2); border-radius:18px; padding:10px 16px 16px; margin:0; background:var(--glass); min-width:0}
fieldset.fs legend{font-family:var(--f-display); font-weight:700; font-size:15px; padding:0 8px}
output.in{display:flex; align-items:center; background:var(--glass); font-weight:700; font-variant-numeric:tabular-nums}
.amt-in{color:var(--good); font-weight:700} .amt-out{color:var(--bad); font-weight:700}
tr.rev td{opacity:.55} tr.rev td.num{text-decoration:line-through}
table.data tfoot td{font-weight:700; background:var(--glass-2); border-top:1px solid var(--line); border-bottom:0}
.linkbtn{border:0; background:none; padding:0; color:var(--violet); font-weight:650; cursor:pointer; font-size:13.5px; text-decoration:underline; text-underline-offset:2px}
.acc-cards{display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px}
.acc{padding:16px 18px; display:flex; flex-direction:column; gap:8px; min-width:0}
.acc .bal{font-family:var(--f-display); font-size:26px; font-weight:800; font-variant-numeric:tabular-nums}
.acc .bal.neg{color:var(--bad)}
.mini{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:3px 12px; font-size:13.5px; font-variant-numeric:tabular-nums}
.mini span:nth-child(odd){color:var(--ink-3)}
.dialog.xwide{width:min(1200px,100%)}
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
.filters .in{width:auto}
.filters input[type=date].in{width:165px}

/* ---------- modal, toast, lock ---------- */
.modal-root{position:fixed; inset:0; z-index:40; display:grid; place-items:center; padding:24px}
.modal-root.top{z-index:60}
.scrim{position:absolute; inset:0; background:rgba(20,30,15,.45)}
.dialog{position:relative; width:min(560px,100%); max-height:calc(100vh - 48px); overflow:auto; border-radius:24px; background:var(--solid); overscroll-behavior:contain}
.dialog.wide{width:min(940px,100%)}
.dlg-head{display:flex; align-items:center; justify-content:space-between; gap:12px; padding:16px 22px 12px; position:sticky; top:0; z-index:1;
  background:var(--violet); color:var(--on-violet); border-bottom:3px solid var(--mint)}
.dlg-head .icon-btn{background:rgba(255,255,255,.16); border-color:transparent; color:var(--on-violet)}
.dlg-body{padding:18px 22px 22px}
.toasts{position:fixed; right:max(20px, env(safe-area-inset-right,0px)); bottom:20px; z-index:80; display:flex; flex-direction:column; gap:8px; align-items:flex-end}
.toast{padding:11px 18px; border-radius:999px; font-weight:600; font-size:14.5px; max-width:460px}
.toast.bad{color:var(--bad)}
.lock{position:fixed; inset:0; z-index:90; display:grid; place-items:center; padding:24px;
  background-color:var(--bg-b); background-image:linear-gradient(180deg, var(--bg-a), var(--bg-b) 55%, var(--bg-c))}
.lock-card{width:min(400px,100%); padding:28px; display:flex; flex-direction:column; gap:16px; align-items:center; text-align:center}
.lock-card .in{text-align:center; font-size:22px; letter-spacing:.4em; height:52px}
.boot{position:fixed; inset:0; z-index:100; display:grid; place-items:center; background:var(--bg-b); color:var(--ink-2); font-weight:600}
.boot[hidden]{display:none}
.boot-inner{display:flex; flex-direction:column; align-items:center; gap:14px}
.spin{width:34px; height:34px; border-radius:50%; border:3px solid var(--violet-soft); border-top-color:var(--violet); animation:spin 0.9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important} }

/* Desktop is the target. Below ~900px the sidebar simply moves to the top so nothing overflows. */
@media (max-width: 1100px){ .pform{grid-template-columns:1fr} .calc{position:static} .form-grid{grid-template-columns:repeat(2,minmax(0,1fr))} .grid-3,.grid-2{grid-template-columns:1fr} .kv{grid-template-columns:repeat(2,minmax(0,1fr))} }

<script>
'use strict';
/* =====================================================================
   AgriLedger — Phase 1
   Rules used everywhere:
   - Money is stored as whole paise (integers). Any calculated amount is
     rounded once, half-up, to the nearest paisa.
   - Weight is stored in kg (2 decimals). Quintal = kg / 100, shown with
     the decimals chosen in Settings.
   - Dates are stored as YYYY-MM-DD and shown as DD-MM-YYYY.
   - Nothing financial is ever hard-deleted; every change goes to the audit log.
   ===================================================================== */
const APP = 'AgriLedger', SCHEMA = 1, LSKEY = 'agriledger.data.v1', THEMEKEY = 'agriledger.theme';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const pad = n => String(n).padStart(2, '0');
const cmp = (a, b) => a < b ? -1 : a > b ? 1 : 0;   // fast compare for dates and IDs
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const inViewer = !!(window.claude && typeof window.claude.use === 'function');
const capP = name => inViewer ? window.claude.use(name).catch(() => null) : Promise.resolve(null);

let S = null;            // the whole ledger (in memory)
let VER = 0;             // bumped on every change; derived figures are cached per version
const ui = { route: 'dashboard', farmerId: null, fq: '', fcat: '', fstatus: 'active', setTab: 'business', listKey: 'farmerCategories',
  auditEntity: '', auditQ: '', auditLimit: 100, season: null, restore: null, gateOkAt: 0, modalResolve: null, promptResolve: null, lastActive: Date.now() };

/* ---------------- numbers, money, dates ---------------- */
function roundHalfUp(x) { return x < 0 ? -Math.floor(-x + 0.5 + 1e-9) : Math.floor(x + 0.5 + 1e-9); }
const nfMoney = new Intl.NumberFormat('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function rs(p) { if (p == null || !isFinite(p)) return '—'; return (p < 0 ? '-' : '') + 'Rs ' + nfMoney.format(Math.abs(p) / 100); }
function fmtNum(n, d = 2) { return new Intl.NumberFormat('en-IN', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n); }
function qDec() { return (S && S.settings.calc.quintalDecimals) || 2; }
/* Typed number -> whole units with `places` decimals, half-up: parseDec("1,25,000.505", 2) = 12500051.
   Returns null for blank, NaN for junk. */
function parseDec(raw, places) {
  let s = String(raw ?? '').replace(/rs\.?|₹|,|\s/gi, '');
  if (s === '') return null;
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(s)) return NaN;
  const neg = s[0] === '-'; if (neg) s = s.slice(1);
  let [i, f = ''] = s.split('.');
  f = (f + '0'.repeat(places + 1)).slice(0, places + 1);
  let v = Number(i || 0) * 10 ** places + Number(f.slice(0, places) || 0);
  if (Number(f[places]) >= 5) v += 1;
  return neg ? -v : v;
}
const parseMoney = raw => parseDec(raw, 2);
function moneyInput(p) { return p == null ? '' : (p / 100).toFixed(2); }
function isoToday() { const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function validIso(s) { if (!/^\d{4}-\d{2}-\d{2}$/.test(s || '')) return false; const [y, m, d] = s.split('-').map(Number); const t = new Date(y, m - 1, d); return t.getFullYear() === y && t.getMonth() === m - 1 && t.getDate() === d; }
function fmtDate(iso) { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}-${m}-${y}`; }
function fmtDT(ts) { if (!ts) return '—'; const d = new Date(ts); return `${pad(d.getDate())}-${pad(d.getMonth() + 1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function daysSince(ts) { return Math.floor((Date.now() - ts) / 86400000); }
function fyLabel(y, m) { const st = S.settings.fyStartMonth; const fy = m >= st ? y : y - 1; return fy + '-' + pad((fy + 1) % 100); }
function fyOf(iso) { const [y, m] = iso.split('-').map(Number); return fyLabel(y, m); }
function seasonOf(iso) {
  const [y, m] = iso.split('-').map(Number);
  for (const s of S.settings.seasons) {
    const wrap = s.from > s.to;
    const inside = wrap ? (m >= s.from || m <= s.to) : (m >= s.from && m <= s.to);
    if (inside) { const sy = wrap && m < s.from ? y - 1 : y; return s.name + ' ' + fyLabel(sy, s.from); }
  }
  return 'No season ' + fyOf(iso);
}

/* ---------------- core calculations (shared by later phases) ---------------- */
function calcSimpleInterest(pPaise, ratePct, unit, days, conv) {
  const basis = unit === 'month' ? conv.monthlyDayBasis : conv.annualDayBasis;
  const interest = roundHalfUp(pPaise * ratePct * days / (100 * basis));
  return { basis, interest, words: `${rs(pPaise)} × ${ratePct}% per ${unit} × ${days} days ÷ ${basis} days = ${rs(interest)}` };
}

/* ---------------- SHA-256 (PIN + backup checksum; works offline) ---------------- */
function sha256Hex(str) {
  const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const b = Array.from(new TextEncoder().encode(str)); const bits = b.length * 8;
  b.push(0x80); while (b.length % 64 !== 56) b.push(0);
  const hi = Math.floor(bits / 0x100000000), lo = bits >>> 0;
  b.push((hi >>> 24) & 255, (hi >>> 16) & 255, (hi >>> 8) & 255, hi & 255, (lo >>> 24) & 255, (lo >>> 16) & 255, (lo >>> 8) & 255, lo & 255);
  let H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];

function seasonCoverage() {
  const cover = Array(13).fill(0);
  for (const s of S.settings.seasons) { let m = s.from; for (let i = 0; i < 12; i++) { cover[m]++; if (m === s.to) break; m = m % 12 + 1; } }
  const gaps = [], overl = [];
  for (let m = 1; m <= 12; m++) { if (!cover[m]) gaps.push(MONTHS[m - 1]); if (cover[m] > 1) overl.push(MONTHS[m - 1]); }
  return { gaps, overl };
}

            <button type="button" class="icon-btn" data-act="list-move" data-i="${i}" data-d="1" aria-label="Move down" ${i === items.length - 1 ? 'disabled' : ''}>↓</button>

        }).join('') : `<div class="empty" style="padding:20px"><div class="e-mark">${svg('note', 34)}</div><h3>Empty list</h3><p>Add your own values below. Values you type in forms are added automatically.</p></div>`}</div>
        <form data-form="list-add" class="row" novalidate><input class="in" name="val" maxlength="60" placeholder="New value…" style="flex:1 1 240px" aria-label="New value">
          ${meanings ? `<select class="in" name="meaning" style="width:auto" aria-label="Meaning">${Object.entries(meanings).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select>` : ''}
          <button class="btn primary" type="submit">Add</button></form>

  },
  accounts() {
    const A = S.settings.accounts;
    return `<section class="glass card">
      <div class="card-head"><div><h2>Cash and bank accounts</h2><p class="muted small" style="margin-top:4px">Name your cash box and each bank account. Balances will be worked out from the Payments ledger in Phase 2.</p></div><button type="button" class="btn primary" data-act="account-add">＋ Add account</button></div>
      <div class="table-wrap"><table class="data"><thead><tr><th>Account</th><th>Type</th><th class="num">Opening balance</th><th>As on</th><th>Status</th><th></th></tr></thead><tbody>
      ${A.map(a => `<tr><td><b>${esc(a.name)}</b></td><td>${esc(a.type)}</td><td class="num">${rs(a.opening)}</td><td class="tnum">${fmtDate(a.openingDate)}</td><td>${a.active ? '<span class="chip good">In use</span>' : '<span class="chip">Closed</span>'}</td><td class="num"><button type="button" class="btn sm" data-act="account-edit" data-id="${a.id}">Edit</button></td></tr>`).join('')}
      </tbody></table></div></section>`;
  },
  security() {
    const sec = S.settings.security;
    return `<div class="grid-2"><section class="glass card stack">
      <h2>PIN lock</h2>
      ${sec.pinHash ? `<p><span class="chip good">PIN is set</span></p>
        <form data-form="sec-opts" class="stack" novalidate>
          <label class="switch"><input type="checkbox" name="lockOnOpen" ${sec.lockOnOpen ? 'checked' : ''}><span class="track"></span>Ask for PIN when the app opens</label>
          <label class="switch"><input type="checkbox" name="pinForSensitive" ${sec.pinForSensitive ? 'checked' : ''}><span class="track"></span>Ask for PIN before sensitive changes</label>
          ${field('Lock automatically after', `<select class="in" name="autoLockMin">${[0, 5, 10, 15, 30, 60].map(m => `<option value="${m}" ${m === Number(sec.autoLockMin) ? 'selected' : ''}>${m ? m + ' minutes of no use' : 'Never'}</option>`).join('')}</select>`)}
          <p class="muted small">Sensitive changes: settings, lists of accounts and opening balances, restoring a backup, and farmer bank or Aadhaar details.</p>
          <div class="row end"><button type="button" class="btn danger" data-act="pin-remove">Remove PIN</button><button type="button" class="btn" data-act="pin-set">Change PIN</button><button class="btn primary" type="submit">Save</button></div>
        </form>`
      : `<p>No PIN is set. Anyone using this computer can open the app.</p><div><button type="button" class="btn primary" data-act="pin-set">Set a PIN</button></div>`}
      <p class="muted small">If you forget the PIN, you can reset it with your recovery answer.</p>

      <p class="muted small">Full Aadhaar or full bank account numbers are never stored.</p>

  },
  backup() {
    const lb = S.meta.lastBackupAt;
    const where = Store.mode === 'cloud' ? 'Your data is saved privately in your Claude account for this app. Only you can see it.' : Store.mode === 'idb' ? `Your data is saved in this device's own storage.${Sync.ready() ? ' A copy goes to your Google Sheet automatically.' : ' Connect the Google Sheet (Settings › Google Sheet) so a copy is kept online.'}` : Store.mode === 'local' ? 'Your data is saved in this browser on this computer only. If browser data is cleared, it is gone, so keep backups.' : 'This browser is blocking storage. Nothing is being saved. Download a backup before closing.';
    return `<div class="grid-2"><section class="glass card stack iri">
      <h2>Backup</h2>
      <p>Last backup: <b>${lb ? fmtDT(lb) : 'never'}</b>${lb && daysSince(lb) > 7 ? ' <span class="chip warn">older than 7 days</span>' : ''}</p>
      <p class="muted">Downloads one .json file with all farmers, settings, lists and the audit log. Keep it in Google Drive, a pen drive or email it to yourself.</p>
      <div><button type="button" class="btn primary" data-act="backup">Download backup</button></div>
    </section>
    <section class="glass card stack">
      <h2>Restore</h2>
      <p class="muted">Pick a backup file. You will see what is inside before anything changes. Restoring replaces all current data.</p>
      <div><button type="button" class="btn" data-act="restore-pick">Choose backup file…</button></div>
    </section></div>
    <section class="glass card"><h2 style="margin-bottom:8px">Where your data is kept</h2><p>${where}</p>
      <p class="muted small" style="margin-top:8px">${S.farmers.length} farmers · ${S.purchases.length} purchases · ${S.sales.length} sales · ${S.txns.length} payments · ${S.expenses.length} expenses · ${S.files.length} attachments · ${S.audit.length} audit entries · started ${fmtDT(S.meta.createdAt)}</p>
      ${Store.mode === 'local' ? '<p class="muted small" style="margin-top:6px">Attached photos use browser space. If saving fails, take a backup and attach fewer or smaller files.</p>' : ''}</section>`;
  },
  audit() {
    const ents = uniq(S.audit.map(a => a.entity)), q = norm(ui.auditQ);
    const dayOf = ts => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const rows = S.audit.filter(a => (!ui.auditEntity || a.entity === ui.auditEntity) && (!ui.auditFrom || dayOf(a.at) >= ui.auditFrom) && (!ui.auditTo || dayOf(a.at) <= ui.auditTo) && (!q || norm([a.recordId, a.action, a.reason, ...(a.changes || []).map(c => c.f + ' ' + c.o + ' ' + c.n)].join(' ')).includes(q))).slice().reverse();
    const shown = rows.slice(0, ui.auditLimit);
    return `<section class="glass card stack">
      <div class="card-head" style="margin:0"><div><h2>Audit log</h2><p class="muted small" style="margin-top:4px">Every change: when, what it was before, what it became, and why. Entries can't be edited or removed.</p></div>
        <button type="button" class="btn" data-act="export-audit" ${S.audit.length ? '' : 'disabled'}>Export CSV</button></div>
      <div class="row"><div class="search"><input class="in" type="search" placeholder="Search ID, field or reason…" value="${esc(ui.auditQ)}" data-input="auditQ" aria-label="Search audit log"><span class="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></span></div>
        <select class="in" style="width:auto" data-change="auditEntity" aria-label="Section"><option value="">All sections</option>${ents.map(e => `<option ${e === ui.auditEntity ? 'selected' : ''}>${esc(e)}</option>`).join('')}</select>
        <label class="row small" style="gap:6px">From <input class="in" style="width:165px" type="date" data-change="flt" data-k="auditFrom" value="${esc(ui.auditFrom || '')}"></label><label class="row small" style="gap:6px">To <input class="in" style="width:165px" type="date" data-change="flt" data-k="auditTo" value="${esc(ui.auditTo || '')}"></label></div>
      <div id="auditTable">${shown.length ? `<div class="table-wrap"><table class="data"><thead><tr><th>When</th><th>Section</th><th>Record</th><th>Action and changes</th><th>Reason</th></tr></thead><tbody>
        ${shown.map(a => `<tr><td class="nowrap tnum">${fmtDT(a.at)}</td><td>${esc(a.entity)}</td><td class="nowrap">${a.recordId ? `<span class="chip mono">${esc(a.recordId)}</span>` : ''}</td><td><b>${esc(a.action)}</b>${changesHTML(a.changes)}</td><td>${esc(a.reason) || '<span class="muted">—</span>'}</td></tr>`).join('')}
      </tbody></table></div>${rows.length > shown.length ? `<div class="row" style="justify-content:center;margin-top:10px"><button type="button" class="btn" data-act="audit-more">Show more (${rows.length - shown.length} older)</button></div>` : ''}`
      : `<div class="empty"><div class="e-mark">${svg('note', 34)}</div><h3>${S.audit.length ? 'No entries match' : 'No changes yet'}</h3><p>${S.audit.length ? 'Try another search or section.' : 'When you add or edit anything, it will be recorded here.'}</p></div>`}</div>
    </section>`;
  },
  checks() {
    const conv = { monthlyDayBasis: 30, annualDayBasis: 365 };
    const p = purchaseCalc({ grossCkg: 330000, tareCkg: 5000, qtyCkg: null, rate: 230000, qd: 0, chF: 0, chMe: 0 });
    const i1 = calcSimpleInterest(5000000, 2, 'month', 90, conv), i2 = calcSimpleInterest(5000000, 24, 'year', 90, conv);
    const X = sandboxChecks(), m = X.sale;
    const snap = JSON.stringify(S), round = JSON.stringify(migrate(JSON.parse(JSON.stringify({ app: APP, data: JSON.parse(snap) })).data));
    const C = [
      ['Purchase: 50 bags, gross 3,300 kg, tare 50 kg, Rs 2,300 per quintal', `Net ${fmtKg(p.netCkg)} kg = ${fmtNum(p.ckg / 10000, 2)} qtl → ${rs(p.gross)}`, p.netCkg === 325000 && p.ckg === 325000 && p.gross === 7475000],
      ['Interest: Rs 50,000 at 2% per month for 90 days (30-day month)', i1.words, i1.interest === 300000],
      ['Interest: Rs 50,000 at 24% per year for 90 days (365-day year)', i2.words, i2.interest === 295890],
      ['Partial sale: bought 100 qtl at Rs 2,200; sold 40 qtl at Rs 2,450; Rs 1,000 expenses', `COGS ${rs(m.cogs)} · Gross profit ${rs(m.gross)} · Net ${rs(m.net)} · Margin ${fmtNum(m.pct)}% · ${fmtQ(X.remain)} qtl left in the lot`, m.cogs === 8800000 && m.gross === 1000000 && m.net === 900000 && X.remain === 600000],
      ['A failed or pending payment never changes the account balance', `Opening Rs 1,00,000; paid Rs 30,000 done, Rs 20,000 pending, Rs 10,000 failed → balance ${rs(X.b1)}`, X.b1 === 7000000],
      ['A pending payment does not mark a purchase as paid', `Rs 50,000 pending against the lot → status "${X.pendStatus}"`, X.pendStatus === 'Unpaid'],
      ['A reversed entry stays in the list and totals update', `Done payment reversed → balance back to ${rs(X.b2)}; entry still listed (${X.kept} entries); reversed purchase left out of stock (${fmtQ(X.stock)} qtl)`, X.b2 === 10000000 && X.kept === 3 && X.stock === 600000],
      ['Advance engine: Rs 50,000 at 2% per month, 01-01 to 01-04 (90 days)', `${X.e1.segs.map(s => `${rs(s.base)} × 2% × ${s.days} ÷ ${X.e1.basis}`).join(' + ')} = ${rs(X.e1.accrued)}`, X.e1.accrued === 300000],
      ['Advance engine: same principal at 24% per year for 90 days', `= ${rs(X.e2.accrued)}`, X.e2.accrued === 295890],
      ['Repayment split, interest first: Rs 10,000 paid after 90 days at 2%/month', `Interest ${rs(X.split.i)} + principal ${rs(X.split.p)} → principal left ${rs(X.afterRep.prinOut)}, interest left ${rs(X.afterRep.intOut)}`, X.split.i === 300000 && X.split.p === 700000 && X.afterRep.prinOut === 4300000 && X.afterRep.intOut === 0],
      ['A government procurement record never appears in my purchases, stock or turnover', `With a 50 qtl procurement record added: stock still ${fmtQ(X.stockG)} qtl, purchases ${X.purchG}, trading turnover ${rs(X.turnG)}`, X.stockG === 600000 && X.purchG === 1 && X.turnG === 9800000],
      ['An accepted procurement record never shows the farmer as Paid', `Status "Accepted", nothing verified → "${X.gPay}"; trying to mark it Paid: "${X.gBlock.slice(0, 60)}…"`, X.gPay === 'Not paid yet' && !!X.gBlock],
      ['Interest accrued but not collected is not in realized earnings', `Interest accrued ${rs(X.m.intAccrued)}; realized earnings ${rs(X.m.realized)} = trading profit ${rs(X.m.tradeNet)} + agency received ${rs(X.m.agReceived)} + interest recovered ${rs(X.m.intRecovered)}`, X.m.intAccrued === 300000 && X.m.realized === 900000],
      ['Indian number format', `12500050 paise → ${rs(12500050)}`, rs(12500050) === 'Rs 1,25,000.50'],
      ['Rounding of typed amounts (half paisa rounds up)', `"1,25,000.505" → ${parseMoney('1,25,000.505')} paise`, parseMoney('1,25,000.505') === 12500051 && isNaN(parseMoney('12a'))],
      ['Dates and financial year', `31-03-2027 → FY ${fyLabel(2027, 3)}; 01-04-2027 → FY ${fyLabel(2027, 4)}; shown as ${fmtDate('2027-04-01')}`, fyLabel(2027, 3) === '2026-27' && fyLabel(2027, 4) === '2027-28' && fmtDate('2027-04-01') === '01-04-2027'],
      ['Backup then restore gives back exactly the same data', `Your current data (${S.farmers.length} farmers, ${S.audit.length} audit entries) packed and unpacked`, snap === round],
      ['Empty app shows zero figures and no sample data', `${S.farmers.length} farmers stored; the app never creates sample records`, true]
    ];
    const later = [];
    return `<section class="glass card stack"><div><h2>Self-check</h2><p class="muted small" style="margin-top:4px">The app runs its own calculation rules on the test cases from your brief. These use the same code as the real entries will.</p></div>
      <div class="check-list">${C.map(([t, d, ok]) => `<div class="ck"><span class="mark ${ok ? 'pass' : 'fail'}">${ok ? '✓' : '✕'}</span><div><b>${t}</b><br><code>${esc(d)}</code></div><span class="chip ${ok ? 'good' : 'bad'}">${ok ? 'Pass' : 'Fail'}</span></div>`).join('')}
      ${later.map(([t, ph]) => `<div class="ck"><span class="mark wait">…</span><div><b>${t}</b></div><span class="chip">Tested in Phase ${ph}</span></div>`).join('')}</div></section>`;
  }
};

/* ===================== ACTIONS ===================== */
const ACT = {
  go: el => { closeModal(); go(el.dataset.r, Object.assign({ farmerId: null, purchaseId: null, saleId: null }, el.dataset.tab ? { ptab: el.dataset.tab } : {})); },
  theme: el => { applyTheme(el.dataset.v); renderNav(); },
  'close-modal': () => closeModal(),
  'close-prompt': () => closePrompt(),
  'retry-save': () => { if (Store.mode !== 'memory') { Store.dirtyMain = true; Store.schedule(); } },
  'lock-now': () => { if (hasPin()) showLock(); },
  'add-farmer': () => openModal('Add farmer', farmerForm(null), true),
  'edit-farmer': el => { const f = S.farmers.find(x => x.id === el.dataset.id); if (f) openModal('Edit ' + f.id, farmerForm(f), true); },
  'open-farmer': el => go('farmers', { farmerId: el.dataset.id }),
  'back-farmers': () => go('farmers', { farmerId: null }),
  fstatus: el => { ui.fstatus = el.dataset.v; ui.lim = {}; render(); },
  'copy-farmer': el => {
    const f = S.farmers.find(x => x.id === el.dataset.id); if (!f) return;
    copyText([`${f.name} (${f.id})`, f.mobile && 'Mobile: ' + f.mobile, 'Village: ' + [f.village, f.taluka, f.district].filter(Boolean).join(', '), 'Category: ' + f.category, 'Registered: ' + fmtDate(f.regDate), f.regNo && 'Procurement reg. no.: ' + f.regNo, f.ref712 && '7/12: ' + f.ref712].filter(Boolean).join('\n'));
  },
  'toggle-farmer': async el => {
    const f = S.farmers.find(x => x.id === el.dataset.id); if (!f) return;
    const r = await ask({ title: f.active ? 'Mark farmer inactive?' : 'Mark farmer active?', message: f.active ? `${esc(f.name)} will be hidden from the active list. Their records stay.` : `${esc(f.name)} will show in the active list again.`, ok: f.active ? 'Mark inactive' : 'Mark active', reason: true });
    if (!r.ok) return;
    f.active = !f.active; f.updatedAt = Date.now(); Store.markRow('farmers', f.seq);
    audit('Farmer', f.id, f.active ? 'Marked active' : 'Marked inactive', [{ f: 'Status', o: f.active ? 'Inactive' : 'Active', n: f.active ? 'Active' : 'Inactive' }], r.reason);
    render(); toast('Updated');
  },
  'export-farmers': () => {
    const sens = S.settings.showSensitive;
    const head = ['ID', 'Name', 'Mobile', 'Village', 'Taluka', 'District', 'Address', 'Procurement reg. no.', '7/12 reference', 'Category', 'Registration date', 'Status', 'Notes'].concat(sens ? ['Bank name', 'Account last 4', 'IFSC', 'Aadhaar last 4'] : []);
    const rows = S.farmers.map(f => [f.id, f.name, f.mobile, f.village, f.taluka, f.district, f.address, f.regNo, f.ref712, f.category, fmtDate(f.regDate), f.active ? 'Active' : 'Inactive', f.notes].concat(sens ? [f.bankName, f.accLast4, f.ifsc, f.aadhaarLast4] : []));
    saveFile(`AgriLedger-farmers-${fmtDate(isoToday())}.csv`, toCSV([head, ...rows]), 'text/csv');
  },
  'export-audit': () => {
    const rows = S.audit.map(a => [fmtDT(a.at), a.entity, a.recordId, a.action, (a.changes || []).map(c => `${c.f}: ${c.o} -> ${c.n}`).join(' | '), a.reason]);
    saveFile(`AgriLedger-audit-${fmtDate(isoToday())}.csv`, toCSV([['When', 'Section', 'Record', 'Action', 'Changes', 'Reason'], ...rows]), 'text/csv');
  },
  'audit-more': () => { ui.auditLimit += 100; render(); },
  'set-tab': el => { ui.setTab = el.dataset.v; render(); },
  'list-pick': el => { ui.listKey = el.dataset.v; render(); },
  'list-move': el => {
    const L = S.settings.lists[ui.listKey], i = +el.dataset.i, j = i + +el.dataset.d;
    if (j < 0 || j >= L.length) return;
    [L[i], L[j]] = [L[j], L[i]]; Store.markMain();
    audit('Settings', 'List', 'List reordered', [{ f: listLabel(ui.listKey), o: '', n: L.map(x => x.name || x).join(', ') }]); render();
  },
  'list-rename': async el => {
    const key = ui.listKey, L = S.settings.lists[key], i = +el.dataset.i, d = listDef(key), old = L[i].name || L[i];
    const r = await ask({ title: 'Rename "' + old + '"', ok: 'Rename', extra: field('New name', `<input class="in" name="val" value="${esc(old)}" maxlength="60">`) });
    if (!r.ok) return;
    const nv = (r.vals.val || '').trim();
    if (!nv || nv === old) return;
    if (L.some((x, k) => k !== i && norm(x.name || x) === norm(nv))) { toast(`"${nv}" is already in this list`, true); return; }
    if (typeof L[i] === 'string') L[i] = nv; else L[i].name = nv;
    const n = d[3] && d[3].rename ? d[3].rename(old, nv) : 0;
    Store.markMain(); audit('Settings', 'List', 'List item renamed', [{ f: d[1], o: old, n: nv }], n ? `Also updated ${n} record(s)` : '');
    render(); toast('Renamed' + (n ? `; ${n} record(s) updated` : ''));
  },
  'list-remove': async el => {
    const key = ui.listKey, L = S.settings.lists[key], i = +el.dataset.i, d = listDef(key), it = L[i], nm = it.name || it;
    const used = d[3] && d[3].used ? d[3].used(nm) : 0;
    if (used) { toast(`"${nm}" is used by ${used} record(s). Rename it instead, or change those records first.`, true); return; }
    if (it.meaning && L.filter(x => x.meaning === it.meaning).length === 1 && key === 'paymentStatuses') { toast('Each payment meaning needs at least one status. Rename it instead.', true); return; }
    const r = await ask({ title: `Remove "${nm}"?`, message: 'It will no longer be suggested in forms. Records that already use it keep it.', ok: 'Remove', danger: true });
    if (!r.ok) return;
    L.splice(i, 1); Store.markMain(); audit('Settings', 'List', 'List item removed', [{ f: d[1], o: nm, n: '' }]); render();
  },
  'season-add': () => { $('#seasonRows').insertAdjacentHTML('beforeend', seasonRow({ name: '', from: 1, to: 1 })); },
  'season-del': el => { const rows = $$('#seasonRows .season-row'); if (rows.length <= 1) { toast('Keep at least one season', true); return; } el.closest('.season-row').remove(); },
  'account-add': () => openAccountForm(null),
  'account-edit': el => openAccountForm(S.settings.accounts.find(a => a.id === el.dataset.id)),
  'pin-set': async () => {
    const sec = S.settings.security;
    if (sec.pinHash && !(await gate('change your PIN'))) return;
    openModal(sec.pinHash ? 'Change PIN' : 'Set a PIN', `<form data-form="pin" class="stack" novalidate><div class="form-err" hidden></div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">${field('New PIN (4 to 6 digits)', '<input class="in" name="p1" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">')}${field('Type it again', '<input class="in" name="p2" type="password" inputmode="numeric" maxlength="6" autocomplete="new-password">')}
      ${field('Recovery question', `<input class="in" name="q" maxlength="80" value="${esc(sec.recoveryQ)}" placeholder="e.g. My first shop's village">`, { span: 2 })}${field('Recovery answer', '<input class="in" name="a" maxlength="80" autocomplete="off">', { span: 2, hint: 'Used only if you forget the PIN. Not case-sensitive.' })}</div>
      <div class="row end"><button type="button" class="btn ghost" data-act="close-modal">Cancel</button><button class="btn primary" type="submit">Save PIN</button></div></form>`);
  },
  'pin-remove': async () => {
    if (!(await gate('remove your PIN'))) return;
    const r = await ask({ title: 'Remove PIN?', message: 'Anyone using this computer will be able to open the app.', ok: 'Remove PIN', danger: true });
    if (!r.ok) return;
    Object.assign(S.settings.security, { pinHash: null, salt: null, recoveryHash: null, recoveryQ: '' });
    Store.markMain(); audit('Settings', 'PIN', 'PIN removed'); render(); toast('PIN removed');
  },
  'forgot-pin': () => {
    const sec = S.settings.security, box = $('#forgot');
    box.innerHTML = `<p class="small">${sec.recoveryQ ? esc(sec.recoveryQ) : 'Your recovery answer'}</p><input class="in" id="recAns" style="letter-spacing:normal;font-size:16px;height:44px" autocomplete="off" aria-label="Recovery answer"><button type="button" class="btn" data-act="recover">Reset PIN</button>`;
    $('#recAns').focus();
  },
  recover: () => {
    const sec = S.settings.security, a = norm($('#recAns').value);

function balanceOf(acc, txns) { return txns ? balanceRaw(acc, txns) : memo('bal:' + acc.id + ':' + (acc.opening || 0), () => balanceRaw(acc, S.txns)); }
function balanceRaw(acc, txns) {
  let b = acc.opening || 0;
  for (const t of txns) {
    if (t.st !== 'completed') continue;          // pending, failed and reversed never touch a balance
    if (t.kind === 'in' && t.account === acc.id) b += t.amount;
    else if (t.kind === 'out' && t.account === acc.id) b -= t.amount;
    else if (t.kind === 'transfer') { if (t.account === acc.id) b -= t.amount; if (t.toAccount === acc.id) b += t.amount; }
  }

}
function accountStats(acc) { return memo('acst:' + acc.id + ':' + (acc.opening || 0), () => accountStatsRaw(acc)); }
function accountStatsRaw(acc) {

  for (const t of S.txns) {
    const mine = t.account === acc.id, to = t.kind === 'transfer' && t.toAccount === acc.id;
    if (!mine && !to) continue;
    if (t.st === 'completed') { if (t.kind === 'in') r.inn += t.amount; else if (t.kind === 'out') r.out += t.amount; else { if (mine) r.tout += t.amount; if (to) r.tin += t.amount; } }

}

/* ---------- attachments (photos are shrunk; stored with the ledger and in backups) ---------- */
async function fileToStored(file) {
  if (file.type.startsWith('image/')) {
    const url = URL.createObjectURL(file);
    try {
      const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
      const sc = Math.min(1, 1400 / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      let q = 0.72, data = c.toDataURL('image/jpeg', q);
      while (data.length > 200000 && q > 0.3) { q -= 0.12; data = c.toDataURL('image/jpeg', q); }
      if (data.length > 230000) throw new Error('the photo is too large even after shrinking');
      return { name: file.name.replace(/\.[^.]+$/, '') + '.jpg', type: 'image/jpeg', data };
    } catch (e) { throw new Error(e && e.message ? e.message : 'could not read the photo'); }
    finally { URL.revokeObjectURL(url); }
  }
  if (file.type === 'application/pdf') {
    if (file.size > 150000) throw new Error('PDF files must be under 150 KB. Attach a photo instead.');
    const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    return { name: file.name, type: 'application/pdf', data };
  }
  throw new Error('only photos and PDF files can be attached');
}
async function saveAttachments(input, linkId) {
  const ids = []; if (!input || !input.files || !input.files.length) return ids;
  for (const file of Array.from(input.files).slice(0, 5)) {
    try {
      const st = await fileToStored(file), seq = ++S.counters.file;
      const rec = Object.assign({ id: 'FIL-' + String(seq).padStart(4, '0'), seq, link: linkId, createdAt: Date.now() }, st);
      S.files.push(rec); Store.markRow('files', seq); ids.push(rec.id);
    } catch (e) { toast(`Could not attach ${file.name}: ${e.message}`, true); }
  }
  if (ids.length) Store.markMain();
  return ids;
}

FORMS['sale-edit'] = f => {
  const s = IDX().s.get(f.dataset.id), val = valOf(f);

};

async function reverseRecord(rec) {
  const kind = entityOf(rec.id);
  if (kind === 'Purchase') {
    const sold = IDX().lotSales[rec.id] || []; if (sold.length) { toast(`Reverse the sales from this lot first: ${sold.map(s => s.id).join(', ')}.`, true); return; }
    const adj = S.repays.filter(r => !r.reversed && r.purchaseId === rec.id); if (adj.length) { toast(`Reverse the advance adjustments first: ${adj.map(r => r.id).join(', ')}.`, true); return; }
  }
  if (kind === 'Advance') { const reps = (IDX().reps[rec.id] || []).filter(r => !r.reversed); if (reps.length) { toast(`Reverse the repayments first: ${reps.map(r => r.id).join(', ')}.`, true); return; } }
  const linked = S.txns.filter(t => t.link === rec.id && (t.st === 'completed' || t.st === 'pending'));
  const r = await ask({ title: `Reverse ${rec.id}?`, ok: 'Reverse', danger: true, reason: true,
    message: `${kind} ${rec.id} stays in the records marked <b>Reversed</b> and stops counting in ${kind === 'Expense' ? 'expense totals' : kind === 'Sale' ? 'sales and profit; its quantity goes back into stock' : kind === 'Purchase' ? 'stock and totals' : kind === 'Repayment' ? 'the advance balance (the amount becomes due again)' : 'totals and balances'}.`,
    extra: linked.length ? `<div class="notice"><b>These linked payments will be reversed too:</b> ${linked.map(t => `${t.id} ${rs(t.amount)} (${esc(stLabel(t))})`).join(', ')}</div>` : '' });
  if (!r.ok) return;
  for (const t of linked) setTxnStatus(t, 'reversed', `${rec.id} reversed: ${r.reason}`, 'Reversed with ' + rec.id);
  rec.reversed = true; rec.reversedAt = Date.now(); rec.reverseReason = r.reason; Store.markRow(tableOf(rec.id), rec.seq);
  audit(kind, rec.id, 'Reversed', [{ f: 'Status', o: 'Active', n: 'Reversed' }], r.reason);
  if (kind === 'Expense') closeModal();
  render(); toast(rec.id + ' reversed');
}

function statementData(fid, from, to) {

          for (const t of ['farmers', 'purchases', 'advances', 'procs']) for (const r of S[t]) this.queue.set(t + ':' + r.seq, ++this.n);

    ['Variety', 't', g => g.variety], ['Accepted qtl', 'q', g => Q(g.acceptedCkg)], ['Rejected qtl', 'q', g => Q(g.rejectedCkg)], ['MSP per qtl', 'm', g => M(g.msp)], ['Value recorded (not my turnover)', 'm', g => M(g.gross)],
    ['Deductions', 'm', g => M(g.deductions)], ['Expected farmer payment', 'm', g => M(g.expected)], ['Verified paid', 'm', g => M(gStat(g).verified)], ['Status', 't', g => g.reversed ? 'Reversed' : gStat(g).statusName],
    ['Farmer payment', 't', g => gStat(g).payStatus], ['Acceptance date', 'd', g => g.acceptDate], ['Days waiting', 'n', g => gStat(g).delay], ['Agency expected', 'm', g => M(gStat(g).agExpected)], ['Agency approved', 'm', g => M(gStat(g).agConfirmed)],
    ['Agency received', 'm', g => M(gStat(g).agReceived)], ['Agency pending', 'm', g => M(gStat(g).agPending)], ['Procurement ref', 't', g => g.procRef], ['PFMS / bank ref', 't', g => g.pfmsRef], ['Remarks', 't', g => g.remarks]]],
  audit: ['Audit log', [['ID', 't', a => 'A' + a.seq], ['When', 't', a => fmtDT(a.at)], ['Section', 't', a => a.entity], ['Record', 't', a => a.recordId], ['Action', 't', a => a.action],
    ['Changes', 't', a => (a.changes || []).map(c => `${c.f}: ${c.o ? c.o + ' → ' : ''}${c.n}`).join(' | ')], ['Reason', 't', a => a.reason]]]
};
function sheetPayload(keys) {
  const I = IDX(), want = {};
  const add = (t, rec) => { if (rec && SHEET[t]) (want[t] = want[t] || new Map()).set(rec.seq, rec); };
  const bySeq = (t, seq) => { const arr = S[t], g = arr[seq - 1]; return g && g.seq === seq ? g : arr.find(r => r.seq === seq); };
  for (const k of keys) {
    const [t, sq] = k.split(':'), r = bySeq(t, Number(sq)); if (!r) continue; add(t, r);
    if (r.farmerId) add('farmers', I.f.get(r.farmerId));
    if (t === 'txns' && r.link) { const lr = recById(r.link); if (lr) add(tableOf(r.link), lr); }
    if (t === 'sales') for (const a of r.alloc) add('purchases', I.p.get(a.pid));
    if (t === 'repays') { add('advances', I.a.get(r.advanceId)); if (r.purchaseId) add('purchases', I.p.get(r.purchaseId)); }
    if (t === 'expenses' && r.procId) add('procs', I.g.get(r.procId));
  }
  const tabs = {};
  for (const t in want) { const [tab, cols] = SHEET[t]; tabs[tab] = { cols: cols.map(([h, ty]) => ({ h, t: ty })), rows: [...want[t].values()].map(r => cols.map(([, , fn]) => { const v = fn(r); return v == null ? '' : v; })) }; }
  tabs['Accounts'] = { cols: ['ID', 'Account', 'Type', 'Opening', 'Money in', 'Money out', 'Transfers in', 'Transfers out', 'Balance', 'Pending in', 'Pending out'].map((h, i) => ({ h, t: i < 3 ? 't' : 'm' })),
    rows: S.settings.accounts.map(a => { const s = accountStats(a); return [a.id, a.name, a.type, M(s.opening), M(s.inn), M(s.out), M(s.tin), M(s.tout), M(s.closing), M(s.pendIn), M(s.pendOut)]; }) };
  return tabs;
}
SETTABS.sheet = () => {
  if (!Sync.supported()) return `<section class="glass card stack"><h2>Google Sheet</h2><p>Sending to a Google Sheet works in the phone app (the installed version). This copy inside Claude cannot send data to Google.</p></section>`;
  const c = Sync.cfg || {}, n = Sync.pendingCount();
  return `<div class="grid-2"><section class="glass card stack">
    <h2>Google Sheet</h2>
    <p class="muted">Every entry you make is copied to your Google Sheet, one tab per section. You type in the app; the Sheet is a live copy for viewing, printing and safe keeping.</p>
    <form data-form="sheet" class="stack" novalidate><div class="form-err" hidden></div>
      ${field('Web app URL (from Apps Script › Deploy)', `<input class="in" name="url" value="${esc(c.url || '')}" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off">`)}
      ${field('Sync key (from the Sheet: AgriLedger › Show sync key)', `<input class="in" name="key" value="${esc(c.key || '')}" autocomplete="off">`)}
      <div class="row end">${Sync.ready() ? '<button type="button" class="btn danger" data-act="sheet-off">Disconnect</button>' : ''}<button class="btn primary" type="submit">Test and connect</button></div>
    </form>
    <p class="small muted">Step-by-step help: open <b>SETUP-GUIDE.html</b> from the app's web address.</p></section>
    <section class="glass card stack"><h2>Status</h2>
      <dl class="kv" style="margin:0;grid-template-columns:1fr 1fr">${KV('Connected', Sync.ready() ? 'Yes' + (c.owner ? ' · ' + esc(c.owner) : '') : 'No')}${KV('Sheet', esc(c.sheet || ''))}
        ${KV('Last sent', c.lastOk ? fmtDT(c.lastOk) : 'Never')}${KV('Waiting to send', String(n))}</dl>
      ${Sync.lastErr ? `<div class="notice"><b>Last problem:</b> ${esc(Sync.lastErr)}</div>` : ''}
      <div class="row"><button type="button" class="btn" data-act="sync-now" ${Sync.ready() ? '' : 'disabled'}>Send now</button><button type="button" class="btn" data-act="sync-all" ${Sync.ready() ? '' : 'disabled'}>Send everything again</button></div>
      <p class="small muted">Photos stay on the phone; the Sheet gets every other detail. If the phone is offline, changes wait here and go out automatically.</p></section></div>`;
};
FORMS.sheet = f => submitGuard(f, async () => {
  const val = valOf(f), url = val('url'), key = val('key');
  if (!/^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/.test(url)) { showErrs(f, ['The Web app URL should look like https://script.google.com/macros/s/…/exec']); return; }
  if (key.length < 16) { showErrs(f, ['Paste the full sync key from the Sheet.']); return; }
  if (navigator.onLine === false) { showErrs(f, ['The phone is offline. Connect to the internet and try again.']); return; }
  const old = Sync.cfg; Sync.cfg = { url, key };
  let out;
  try { out = await Sync.post({ ping: true }); }
  catch (e) { Sync.cfg = old; showErrs(f, [/fetch|network|load failed/i.test(e.message || '') ? 'Could not reach the Sheet. Check the URL and that the web app is deployed for "Anyone".' : e.message]); return; }
  Sync.cfg = { url, key, owner: out.owner || '', sheet: out.sheet || '', lastOk: Date.now(), lastFull: isoToday() };
  await idbKV('synccfg', Sync.cfg); Sync.lastErr = '';
  audit('Settings', 'Sheet', 'Google Sheet connected', [{ f: 'Sheet', o: '', n: (out.sheet || '') + (out.owner ? ' (' + out.owner + ')' : '') }]);
  Sync.touchAll(); render(); toast(`Connected to "${out.sheet || 'Google Sheet'}". Sending all records now.`);
});

Object.assign(ACT, {
  more: el => { ui.lim = Object.assign({}, ui.lim, { [el.dataset.k]: pageLim(el.dataset.k) + PAGE() }); const y = window.scrollY; render(); window.scrollTo(0, y); },
  'sync-now': () => { Sync.lastErr = ''; Sync.flush().then(() => { if (ui.route === 'data') render(); }); },
  'sync-all': () => { Sync.touchAll(); toast('All records queued for the Sheet'); render(); },
  'sheet-off': async () => {
    const r = await ask({ title: 'Disconnect the Google Sheet?', message: 'New entries will stay on this phone only. The Sheet keeps what it already has.', ok: 'Disconnect', danger: true });
    if (!r.ok) return; Sync.cfg = null; Sync.queue.clear(); await idbKV('synccfg', null); idbKV('syncq', { q: [], main: false }); audit('Settings', 'Sheet', 'Google Sheet disconnected'); render();
  },
  install: async () => { const p = ui.installPrompt; if (!p) return; p.prompt(); try { await p.userChoice; } catch (e) { } ui.installPrompt = null; render(); }
});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); ui.installPrompt = e; if (ui.route === 'dashboard' && S) renderAlertsOnly(); });

/* ---------------- event wiring ---------------- */
const liveRun = e => { const f = e.target.closest && e.target.closest('form[data-live]'); if (f && LIVE[f.dataset.live]) LIVE[f.dataset.live](f, e.target); };
document.addEventListener('input', liveRun);
document.addEventListener('change', liveRun);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act]; if (fn) { e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (!$('#prompt').hidden) closePrompt(); else if (!$('#modal').hidden) closeModal(); }
  if (e.key === 'Enter' && e.target.matches && e.target.matches('tr[data-act]')) ACT[e.target.dataset.act](e.target);
});
document.addEventListener('submit', e => { const f = e.target.closest('form[data-form]'); if (!f) return; e.preventDefault(); const fn = FORMS[f.dataset.form]; if (fn) fn(f); });
document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && CHANGES[el.dataset.change]) CHANGES[el.dataset.change](el); });
document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && INPUTS[el.dataset.input]) INPUTS[el.dataset.input](el); });

const PAGES = { dashboard: pageDashboard, farmers: pageFarmers, data: pageData, purchases: pagePurchases, payments: pagePayments, expenses: pageExpenses,
  advances: pageAdvances, procurement: pageProcurement, margin: pageMargin, reports: pageReports };

(async function boot() {
  applyTheme(currentTheme());
  let data = null;
  try { data = await Store.init(); } catch (e) { Store.mode = 'memory'; }
  S = data ? migrate(data) : defaultState();
  if (Store.migrated) Store.markAll();
  await Sync.init();
  if (!inViewer && 'serviceWorker' in navigator && /^https?:/.test(location.protocol) && document.querySelector('link[rel=manifest]')) {
    const hadOld = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => reg.update()).catch(() => { });
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadOld) toast('AgriLedger has been updated. Close and reopen the app to use the new version.'); });
  }
  const h = (location.hash || '').slice(1);
  if (PAGES[h]) ui.route = h;
  $('#boot').hidden = true;
  setSave('saved');
  render();
  if (hasPin() && S.settings.security.lockOnOpen) showLock();
  window.__bootMs = Math.round(performance.now());
})();
</script>
